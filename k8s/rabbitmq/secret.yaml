# Credenciais do RabbitMQ (ver comentários em postgres/secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: hash-jobs
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: hash-jobs
type: Opaque
stringData:
  # Nomes que a imagem do rabbitmq usa para criar o usuário inicial
  RABBITMQ_DEFAULT_USER: hash
  RABBITMQ_DEFAULT_PASS: hash-dev-password
  # Nomes que nossa API/processor usam
  RABBITMQ_USER: hash
  RABBITMQ_PASSWORD: hash-dev-password
