# Secret = guarda dados sensíveis (senhas, tokens).
# ATENÇÃO: Secret NÃO é criptografado por padrão, é só base64 no etcd.
# A vantagem sobre ConfigMap é controle de acesso (RBAC) separado e não aparecer
# em `kubectl describe`. Em produção: External Secrets / Sealed Secrets / Vault.
#
# `stringData` aceita texto puro; o k8s converte para base64 em `data` sozinho.
# Para estudo está versionado no git. NUNCA faça isso com senha real.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: hash-jobs
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: hash-jobs
type: Opaque
stringData:
  # Nomes iguais aos que a imagem postgres espera (POSTGRES_*) ...
  POSTGRES_USER: hash
  POSTGRES_PASSWORD: hash-dev-password
  POSTGRES_DB: hashjobs
  # ... e aos que nossa API/processor esperam (PG*). Assim usamos envFrom direto.
  PGUSER: hash
  PGPASSWORD: hash-dev-password
  PGDATABASE: hashjobs
