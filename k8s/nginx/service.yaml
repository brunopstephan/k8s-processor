# Service NodePort: abre a MESMA porta (30080) em TODOS os nodes do cluster.
# Tráfego que chega em <ip-de-qualquer-node>:30080 vai para um pod do nginx.
# Faixa permitida: 30000-32767.
#
# No kind, o kind-config.yaml mapeia localhost:8080 do Mac -> 30080 do node.
# Em cloud você usaria type: LoadBalancer (cria um LB da AWS/GCP na frente dos nodes).
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: hash-jobs
  labels:
    app.kubernetes.io/name: nginx
    app.kubernetes.io/part-of: hash-jobs
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: http
      port: 80 # porta do Service dentro do cluster (nginx.hash-jobs:80)
      targetPort: http # porta do container (8080)
      nodePort: 30080 # porta aberta nos nodes
